name: AgroSolutions CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      # --- ETAPA 1: COMPILAÇÃO E VERIFICAÇÃO DO CÓDIGO ---
      - name: Configurar o SDK do .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Restaurar Dependências Nuget
        run: |
          dotnet restore AlertServiceApi/AlertServiceApi.csproj
          dotnet restore IdentityServiceApi/IdentityServiceApi.csproj
          dotnet restore IngestionServiceApi/IngestionServiceApi.csproj
          dotnet restore PropertyServiceApi/PropertyServiceApi.csproj

      - name: Compilar Código C# (Build de Segurança)
        run: |
          dotnet build AlertServiceApi/AlertServiceApi.csproj --no-restore --configuration Release
          dotnet build IdentityServiceApi/IdentityServiceApi.csproj --no-restore --configuration Release
          dotnet build IngestionServiceApi/IngestionServiceApi.csproj --no-restore --configuration Release
          dotnet build PropertyServiceApi/PropertyServiceApi.csproj --no-restore --configuration Release

      # --- ETAPA 2: CONFIGURAÇÃO DO AMBIENTE DOCKER ---
      - name: Configurar QEMU (Suporte Multi-plataforma)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- ETAPA 3: CONSTRUÇÃO E ENVIO DAS IMAGENS ---

      # 3.1. Identity Service
      - name: Build e Push - Identity Service
        uses: docker/build-push-action@v5
        with:
          context: ./IdentityServiceApi
          file: ./IdentityServiceApi/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrosolutions-identity:latest

      # 3.2. Property Service
      - name: Build e Push - Property Service
        uses: docker/build-push-action@v5
        with:
          context: ./PropertyServiceApi
          file: ./PropertyServiceApi/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrosolutions-property:latest

      # 3.3. Ingestion Service
      - name: Build e Push - Ingestion Service
        uses: docker/build-push-action@v5
        with:
          context: ./IngestionServiceApi
          file: ./IngestionServiceApi/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrosolutions-ingestion:latest

      # 3.4. Alert Service
      - name: Build e Push - Alert Service
        uses: docker/build-push-action@v5
        with:
          context: ./AlertServiceApi
          file: ./AlertServiceApi/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrosolutions-alert:latest

      # 3.5. Frontend App (React + Nginx)
      - name: Build e Push - Frontend App
        uses: docker/build-push-action@v5
        with:
          context: ./FrontendApp
          file: ./FrontendApp/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/agrosolutions-frontend:latest
